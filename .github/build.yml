name: Build EV Raster Crafts installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Build installer
        run: node build-installer.js

      - uses: actions/upload-artifact@v4
        with:
          name: EV_Raster_Crafts_Setup
          path: dist/EV_Raster_Crafts_Setup.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EV_Raster_Crafts_Setup.exe
